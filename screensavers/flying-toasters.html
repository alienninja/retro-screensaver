<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flying Toasters Screensaver — After Dark Homage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        .back-link { position: fixed; top: 8px; left: 8px; z-index: 999; font: 12px Tahoma, Arial, sans-serif; color: rgba(255,255,255,0.4); text-decoration: none; padding: 4px 8px; }
        .back-link:hover { color: rgba(255,255,255,0.9); }
    </style>
</head>
<body>
    <a href="/" class="back-link">← retro.bithash.cc</a>
    <canvas id="c"></canvas>

    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        let cfg = { numToasters: 14, speed: 1.6, toastDarkness: 'golden' };

        window.addEventListener('message', e => {
            if (e.origin !== 'null' && e.origin !== location.origin) return;
            if (e.data && e.data.cfg) Object.assign(cfg, e.data.cfg);
        });

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Toaster {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = initial ? Math.random() * (canvas.width + 200) : canvas.width + 80;
                this.y = initial ? Math.random() * (canvas.height + 200) - 100 : -80;
                this.scale = 0.75 + Math.random() * 0.5;
                this.wingPhase = Math.random() * Math.PI * 2;
                this.wingSpeed = 0.15 + Math.random() * 0.08;
            }
            update(spd) {
                this.x -= spd * 1.8 * this.scale;
                this.y += spd * 1.2 * this.scale;
                this.wingPhase += this.wingSpeed * (spd / 1.5);
                if (this.x < -120 || this.y > canvas.height + 120) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.scale, this.scale);

                const wingFlap = Math.sin(this.wingPhase);

                // Back Wing
                ctx.save();
                ctx.translate(20, -10);
                ctx.rotate(wingFlap * 0.5 - 0.2);
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#888888';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, -18, 12, 28, 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                // Toaster Body (Chrome 3D box)
                ctx.fillStyle = '#d8d8d8';
                ctx.strokeStyle = '#555555';
                ctx.lineWidth = 3;

                // Main body
                ctx.beginPath();
                ctx.roundRect(-40, -25, 75, 50, 8);
                ctx.fill();
                ctx.stroke();

                // Chrome highlight
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(-36, -22, 67, 12, 4);
                ctx.fill();

                // Toast Slots on top
                ctx.fillStyle = '#222222';
                ctx.fillRect(-28, -25, 20, 4);
                ctx.fillRect(0, -25, 20, 4);

                // Front knob & lever
                ctx.fillStyle = '#111111';
                ctx.fillRect(-35, 2, 8, 14);
                ctx.fillStyle = '#ff2222';
                ctx.fillRect(-38, 6, 12, 6);

                // Feet
                ctx.fillStyle = '#111111';
                ctx.fillRect(-32, 25, 10, 6);
                ctx.fillRect(18, 25, 10, 6);

                // Front Wing
                ctx.save();
                ctx.translate(-5, -5);
                ctx.rotate(wingFlap * 0.6 + 0.1);
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#555555';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, -20, 14, 32, -0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                // Wing feathers detail
                ctx.strokeStyle = '#bbbbbb';
                ctx.beginPath();
                ctx.moveTo(-5, -10); ctx.lineTo(-12, -30);
                ctx.moveTo(0, -10); ctx.lineTo(0, -36);
                ctx.moveTo(5, -10); ctx.lineTo(10, -32);
                ctx.stroke();
                ctx.restore();

                ctx.restore();
            }
        }

        class Toast {
            constructor() { this.reset(true); }
            reset(initial = false) {
                this.x = initial ? Math.random() * (canvas.width + 200) : canvas.width + 50;
                this.y = initial ? Math.random() * (canvas.height + 200) - 100 : -60;
                this.scale = 0.6 + Math.random() * 0.4;
                this.rot = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.02;
            }
            update(spd) {
                this.x -= spd * 1.5 * this.scale;
                this.y += spd * 1.0 * this.scale;
                this.rot += this.rotSpeed;
                if (this.x < -80 || this.y > canvas.height + 80) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rot);
                ctx.scale(this.scale, this.scale);

                // Toast Crust & Crumb
                ctx.fillStyle = '#8b5a2b';
                ctx.strokeStyle = '#5c3a1e';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(-20, -20, 40, 40, 6);
                ctx.fill();
                ctx.stroke();

                // Inner browned toast
                ctx.fillStyle = '#d2a679';
                ctx.beginPath();
                ctx.roundRect(-16, -16, 32, 32, 4);
                ctx.fill();

                // Butter / browning gradient
                ctx.fillStyle = '#ffec99';
                ctx.fillRect(-6, -6, 12, 12);

                ctx.restore();
            }
        }

        const toasters = Array.from({ length: cfg.numToasters }, () => new Toaster());
        const toasts = Array.from({ length: Math.floor(cfg.numToasters * 0.8) }, () => new Toast());

        function loop() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            toasts.forEach(t => { t.update(cfg.speed); t.draw(); });
            toasters.forEach(t => { t.update(cfg.speed); t.draw(); });

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
