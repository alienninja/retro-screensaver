<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D FlowerBox Screensaver — Windows 98 OpenGL Edition</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        .back-link { position: fixed; top: 8px; left: 8px; z-index: 999; font: 12px Tahoma, Arial, sans-serif; color: rgba(255,255,255,0.4); text-decoration: none; padding: 4px 8px; }
        .back-link:hover { color: rgba(255,255,255,0.9); }
    </style>
</head>
<body>
    <a href="/" class="back-link">← retro.bithash.cc</a>
    <script src="../js/three.r128.min.js"></script>
    <script>
        let cfg = { speed: 1.2, complexity: 6 };

        window.addEventListener('message', e => {
            if (e.origin !== 'null' && e.origin !== location.origin) return;
            if (e.data && e.data.cfg) Object.assign(cfg, e.data.cfg);
        });

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Ambient and Dynamic Colored Lights
        scene.add(new THREE.AmbientLight(0x444444));
        const light1 = new THREE.PointLight(0xff2255, 1.5, 50);
        light1.position.set(10, 10, 10);
        scene.add(light1);

        const light2 = new THREE.PointLight(0x00ccff, 1.5, 50);
        light2.position.set(-10, -10, 10);
        scene.add(light2);

        const light3 = new THREE.PointLight(0xffdd00, 1.2, 50);
        light3.position.set(0, 12, -8);
        scene.add(light3);

        // Create the 6 sides of the blooming FlowerBox
        const group = new THREE.Group();
        scene.add(group);

        const SIDE_COUNT = 6;
        const petals = [];

        for (let i = 0; i < SIDE_COUNT; i++) {
            // Box side geometry
            const geo = new THREE.BoxGeometry(4.5, 4.5, 0.4, 8, 8, 2);
            const mat = new THREE.MeshPhongMaterial({
                color: new THREE.Color().setHSL(i / SIDE_COUNT, 0.85, 0.55),
                specular: 0xffffff,
                shininess: 90,
                flatShading: false,
                side: THREE.DoubleSide
            });
            const mesh = new THREE.Mesh(geo, mat);

            // Wireframe overlay for authentic OpenGL look
            const wireGeo = new THREE.WireframeGeometry(geo);
            const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 1 });
            const wire = new THREE.LineSegments(wireGeo, wireMat);
            mesh.add(wire);

            // Store original vertex coordinates for procedural blooming
            const pos = geo.attributes.position;
            const orig = pos.clone();

            mesh.userData = { origPos: orig, index: i };
            group.add(mesh);
            petals.push(mesh);
        }

        let time = 0;

        function animate() {
            requestAnimationFrame(animate);

            time += 0.02 * cfg.speed;

            group.rotation.x = time * 0.6;
            group.rotation.y = time * 0.8;
            group.rotation.z = time * 0.3;

            const bloom = Math.sin(time) * 2.2 + 2.5;

            petals.forEach((petal, i) => {
                const angle = (i / SIDE_COUNT) * Math.PI * 2;
                const r = bloom;

                if (i < 4) {
                    petal.position.x = Math.cos(angle) * r;
                    petal.position.y = Math.sin(angle) * r;
                    petal.position.z = Math.sin(time * 1.5 + i) * 1.2;
                    petal.rotation.z = angle + Math.sin(time * 2) * 0.4;
                    petal.rotation.x = Math.sin(time + i) * 0.5;
                } else if (i === 4) {
                    petal.position.set(0, 0, r);
                    petal.rotation.x = Math.PI / 2 + Math.cos(time) * 0.3;
                } else {
                    petal.position.set(0, 0, -r);
                    petal.rotation.x = -Math.PI / 2 + Math.sin(time) * 0.3;
                }

                // Morph vertices for organic folding/blooming
                const geo = petal.geometry;
                const pos = geo.attributes.position;
                const orig = petal.userData.origPos;

                for (let v = 0; v < pos.count; v++) {
                    const ox = orig.getX(v);
                    const oy = orig.getY(v);
                    const oz = orig.getZ(v);

                    const wave = Math.sin(time * 2 + ox * 0.8 + oy * 0.8) * 0.5;
                    pos.setZ(v, oz + wave);
                }
                pos.needsUpdate = true;
                geo.computeVertexNormals();
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
