<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkiFree (1991)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #ffffff;
            color: #000;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Win98 Style Header & HUD ── */
        .sf-header {
            background: #c0c0c0;
            border-bottom: 2px solid #808080;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            z-index: 10;
        }
        .sf-hud {
            display: flex;
            gap: 16px;
        }
        .sf-hud-item {
            background: #fff;
            border: 2px inset #808080;
            padding: 2px 8px;
            color: #000080;
            font-weight: bold;
        }

        #sf-canvas {
            flex: 1;
            background: #ffffff;
            display: block;
            cursor: crosshair;
        }

        /* Game Over / Yeti Overlay */
        .sf-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            z-index: 100;
        }
        .sf-overlay.visible { display: flex; }
        .sf-modal {
            background: #c0c0c0;
            border: 3px outset #fff;
            padding: 16px 24px;
            color: #000;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.5);
        }
        .sf-btn {
            background: #c0c0c0;
            border: 2px outset #fff;
            padding: 6px 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
        }
        .sf-btn:active { border-style: inset; }
    </style>
</head>
<body>

    <div class="sf-header">
        <div>⛷️ SkiFree (1991) — Windows Entertainment Pack</div>
        <div class="sf-hud">
            <div>DIST: <span class="sf-hud-item" id="sf-dist">0 m</span></div>
            <div>SPEED: <span class="sf-hud-item" id="sf-speed">15 mph</span></div>
            <div>SCORE: <span class="sf-hud-item" id="sf-score">0</span></div>
        </div>
    </div>

    <canvas id="sf-canvas"></canvas>

    <div class="sf-overlay" id="sf-modal">
        <div class="sf-modal">
            <h2 id="sf-modal-title" style="color:#aa0000; margin-bottom:8px;">YETI ATTACK!</h2>
            <p id="sf-modal-msg">You were caught by the Abominable Snow Monster!</p>
            <button class="sf-btn" onclick="resetGame()">[ Play Again (R) ]</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sf-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 30;
        }
        resize();
        window.addEventListener('resize', resize);

        // Game State
        let dist = 0;
        let score = 0;
        let speed = 4;
        let angle = 0; // -2 = hard left, -1 = left, 0 = down, 1 = right, 2 = hard right
        let isJumping = false;
        let jumpProgress = 0;
        let isCrashed = false;
        let isEaten = false;
        let gameActive = true;

        // Player Position (Screen-relative)
        let playerX = canvas.width / 2;
        let playerY = 120;

        // Obstacles array
        const OBSTACLE_TYPES = ['tree_small', 'tree_large', 'rock', 'stump', 'ramp', 'dead_tree'];
        let obstacles = [];

        function spawnObstacles() {
            obstacles = [];
            for (let i = 0; i < 40; i++) {
                obstacles.push({
                    x: Math.random() * canvas.width * 1.5 - canvas.width * 0.25,
                    y: 200 + Math.random() * canvas.height * 2,
                    type: OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)]
                });
            }
        }
        spawnObstacles();

        // The Abominable Snow Monster (Yeti)
        let yeti = {
            active: false,
            x: 0,
            y: -100,
            speed: 8,
            frame: 0
        };

        // Keyboard Controls
        window.addEventListener('keydown', e => {
            if (!gameActive) {
                if (e.key === 'r' || e.key === 'R') resetGame();
                return;
            }
            if (e.key === 'ArrowLeft') {
                angle = Math.max(-2, angle - 1);
            } else if (e.key === 'ArrowRight') {
                angle = Math.min(2, angle + 1);
            } else if (e.key === 'ArrowDown') {
                speed = 7; // Fast tuck
            } else if (e.key === 'ArrowUp') {
                speed = 2; // Snowplow brake
            } else if (e.key === ' ' || e.key === 'f' || e.key === 'F') {
                if (!isJumping && !isCrashed) {
                    isJumping = true;
                    jumpProgress = 0;
                }
            } else if (e.key === 'r' || e.key === 'R') {
                resetGame();
            }
        });

        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                speed = 4;
            }
        });

        // Drawing Sprites using Canvas 2D Pixel Art
        function drawSkier(x, y) {
            ctx.save();
            ctx.translate(x, y);

            if (isCrashed) {
                // Skier crashed into snow (skis in air, red boots)
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(-6, -14, 3, 10);
                ctx.fillRect(3, -14, 3, 10);
                // Yellow skis
                ctx.fillStyle = '#ffbb00';
                ctx.fillRect(-8, -18, 7, 3);
                ctx.fillRect(1, -18, 7, 3);
                // Head in snow with puff
                ctx.fillStyle = '#d0d8e8';
                ctx.beginPath(); ctx.arc(0, 2, 8, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                return;
            }

            if (isJumping) {
                // High air jump tuck
                ctx.fillStyle = '#ffbb00'; // Skis
                ctx.fillRect(-12, 10, 24, 3);
                ctx.fillStyle = '#0044aa'; // Blue suit
                ctx.fillRect(-5, -6, 10, 14);
                ctx.fillStyle = '#ff0000'; // Hat
                ctx.fillRect(-4, -12, 8, 6);
                ctx.restore();
                return;
            }

            // Normal Skiing according to angle
            ctx.fillStyle = '#ffbb00'; // Skis
            if (angle === 0) {
                ctx.fillRect(-6, -4, 3, 16);
                ctx.fillRect(3, -4, 3, 16);
            } else if (angle < 0) {
                ctx.fillRect(-8, -2, 14, 3);
                ctx.fillRect(-6, 4, 14, 3);
            } else {
                ctx.fillRect(-6, -2, 14, 3);
                ctx.fillRect(-8, 4, 14, 3);
            }

            // Skier body (Blue jacket)
            ctx.fillStyle = '#0044aa';
            ctx.fillRect(-4, -8, 8, 10);

            // Red hat & face
            ctx.fillStyle = '#ffccaa';
            ctx.fillRect(-3, -13, 6, 5);
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(-4, -16, 8, 4);

            // Poles
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-6, -4); ctx.lineTo(-10, 6);
            ctx.moveTo(6, -4); ctx.lineTo(10, 6);
            ctx.stroke();

            ctx.restore();
        }

        function drawObstacle(ob) {
            ctx.save();
            ctx.translate(ob.x, ob.y);

            if (ob.type === 'tree_small') {
                // Pine tree
                ctx.fillStyle = '#0e5c18';
                ctx.beginPath();
                ctx.moveTo(0, -22); ctx.lineTo(12, 0); ctx.lineTo(-12, 0); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, -12); ctx.lineTo(14, 10); ctx.lineTo(-14, 10); ctx.fill();
                ctx.fillStyle = '#5c3310';
                ctx.fillRect(-2, 10, 4, 6);
            } else if (ob.type === 'tree_large') {
                ctx.fillStyle = '#0a4211';
                ctx.beginPath();
                ctx.moveTo(0, -34); ctx.lineTo(16, -6); ctx.lineTo(-16, -6); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(0, -16); ctx.lineTo(18, 12); ctx.lineTo(-18, 12); ctx.fill();
                ctx.fillStyle = '#5c3310';
                ctx.fillRect(-3, 12, 6, 8);
            } else if (ob.type === 'rock') {
                ctx.fillStyle = '#606870';
                ctx.beginPath();
                ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#808890';
                ctx.fillRect(-4, -5, 6, 4);
            } else if (ob.type === 'stump') {
                ctx.fillStyle = '#6e4420';
                ctx.fillRect(-6, -4, 12, 8);
                ctx.fillStyle = '#aa7744';
                ctx.beginPath(); ctx.ellipse(0, -4, 6, 2, 0, 0, Math.PI * 2); ctx.fill();
            } else if (ob.type === 'ramp') {
                // Jump ramp
                ctx.fillStyle = '#d0d8e8';
                ctx.beginPath();
                ctx.moveTo(-16, 6); ctx.lineTo(16, 6); ctx.lineTo(0, -8); ctx.fill();
                ctx.strokeStyle = '#90a0c0';
                ctx.stroke();
            } else if (ob.type === 'dead_tree') {
                ctx.strokeStyle = '#443322';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 8); ctx.lineTo(0, -18);
                ctx.lineTo(-8, -26); ctx.moveTo(0, -10); ctx.lineTo(8, -20);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawYeti() {
            if (!yeti.active) return;
            ctx.save();
            ctx.translate(yeti.x, yeti.y);

            // Grey fluffy beast
            ctx.fillStyle = '#7a8288';
            ctx.fillRect(-14, -20, 28, 30);
            ctx.beginPath(); ctx.arc(0, -22, 12, 0, Math.PI * 2); ctx.fill();

            // Claws and arms
            const armSwing = Math.sin(yeti.frame * 0.3) * 8;
            ctx.fillStyle = '#5a6268';
            ctx.fillRect(-22, -18 + armSwing, 8, 20);
            ctx.fillRect(14, -18 - armSwing, 8, 20);

            // Face (menacing red eyes, sharp fangs)
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(-5, -24, 3, 3);
            ctx.fillRect(2, -24, 3, 3);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-4, -16, 8, 4); // Mouth
            ctx.fillStyle = '#000000';
            ctx.fillRect(-2, -15, 4, 2);

            ctx.restore();
        }

        function update() {
            if (!gameActive) return;

            // Skier movement
            let dx = 0;
            if (angle === -2) dx = -speed * 1.5;
            else if (angle === -1) dx = -speed * 0.8;
            else if (angle === 1) dx = speed * 0.8;
            else if (angle === 2) dx = speed * 1.5;

            playerX = Math.max(40, Math.min(canvas.width - 40, playerX + dx));

            // Jump handling
            if (isJumping) {
                jumpProgress += 0.05;
                if (jumpProgress >= 1) {
                    isJumping = false;
                    jumpProgress = 0;
                    score += 250; // Trick bonus
                }
            }

            // Scroll world down
            const moveY = isCrashed ? 0 : speed;
            dist += Math.floor(moveY);
            score += Math.floor(moveY * 0.5);

            // Obstacle updates
            obstacles.forEach(ob => {
                ob.y -= moveY;
                if (ob.y < -40) {
                    ob.y = canvas.height + 60 + Math.random() * 200;
                    ob.x = Math.random() * canvas.width;
                    ob.type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
                }

                // Collision detection
                if (!isCrashed && !isJumping) {
                    const distToPlayer = Math.hypot(ob.x - playerX, ob.y - playerY);
                    if (distToPlayer < 16) {
                        if (ob.type === 'ramp') {
                            isJumping = true;
                            jumpProgress = 0;
                        } else {
                            // Crash!
                            isCrashed = true;
                            speed = 0;
                            setTimeout(() => {
                                if (!isEaten) {
                                    isCrashed = false;
                                    speed = 4;
                                }
                            }, 1200);
                        }
                    }
                }
            });

            // Yeti appears past 1500m
            if (dist > 1500 && !yeti.active && !isEaten) {
                yeti.active = true;
                yeti.x = playerX;
                yeti.y = -60;
            }

            // Yeti pursuit logic
            if (yeti.active && !isEaten) {
                yeti.frame++;
                if (yeti.x < playerX) yeti.x += 2.5;
                else if (yeti.x > playerX) yeti.x -= 2.5;
                yeti.y += (yeti.speed - moveY);

                // Caught by Yeti!
                if (Math.hypot(yeti.x - playerX, yeti.y - playerY) < 22) {
                    isEaten = true;
                    gameActive = false;
                    document.getElementById('sf-modal-title').textContent = 'CHOMPED BY YETI!';
                    document.getElementById('sf-modal-msg').textContent = `The Abominable Snow Monster caught you at ${dist}m! Final Score: ${score}`;
                    document.getElementById('sf-modal').classList.add('visible');
                }
            }

            // Update HUD
            document.getElementById('sf-dist').textContent = `${dist} m`;
            document.getElementById('sf-speed').textContent = `${Math.floor(speed * 3.7)} mph`;
            document.getElementById('sf-score').textContent = score;
        }

        function draw() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw ski track trails
            ctx.strokeStyle = '#e0e8f0';
            ctx.lineWidth = 2;

            // Draw obstacles
            obstacles.forEach(drawObstacle);

            // Draw player
            drawSkier(playerX, playerY);

            // Draw Yeti
            drawYeti();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();

        function resetGame() {
            dist = 0;
            score = 0;
            speed = 4;
            angle = 0;
            isCrashed = false;
            isEaten = false;
            isJumping = false;
            yeti.active = false;
            yeti.y = -100;
            gameActive = true;
            document.getElementById('sf-modal').classList.remove('visible');
            spawnObstacles();
        }
    </script>
</body>
</html>
